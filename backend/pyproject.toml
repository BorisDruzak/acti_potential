[project]
name = "acti-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
  "argon2-cffi>=23.1,<26", "pydantic-settings>=2.8,<3",
  "openpyxl>=3.1.5,<3.2", "defusedxml>=0.7.1,<1",
  "pypdf==6.20.1",
  "PyJWT[crypto]==2.15.1", "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
