name: acti-v3
x-app: &app
  image: acti-backend:${ACTI_SOURCE_SHA:?Set source SHA}
  build:
    context: ../backend
    args:
      SOURCE_SHA: ${ACTI_SOURCE_SHA}
  environment: &app-env
    ACTI_DATABASE_URL: ${ACTI_DATABASE_URL:?Set app database URL}
    ACTI_REDIS_URL: redis://redis:6379/0
    ACTI_SESSION_SECRET: ${ACTI_SESSION_SECRET:?Set a random session secret}
    ACTI_ORIGIN: ${ACTI_ORIGIN:?Set HTTPS origin}
    ACTI_STORAGE_ROOT: /documents
    ACTI_SOURCE_SHA: ${ACTI_SOURCE_SHA}
    ACTI_TRUSTED_PROXY_CIDRS: ${ACTI_TRUSTED_PROXY_CIDRS:-}
    ACTI_SEARCH_ALGORITHM_VERSION: ${ACTI_SEARCH_ALGORITHM_VERSION:-lexical-2}
    ACTI_SEARCH_WEIGHTS: ${ACTI_SEARCH_WEIGHTS:-null}
    ACTI_SEARCH_SYNONYMS: ${ACTI_SEARCH_SYNONYMS:-null}
  volumes:
    - type: bind
      source: /srv/acti/documents/objects
      target: /documents
      bind:
        create_host_path: false
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  networks: [internal]
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a pinned PostgreSQL image}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: acti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an external password}
      ACTI_APP_PASSWORD: ${ACTI_APP_PASSWORD:?Set app role password}
      ACTI_OWNER_PASSWORD: ${ACTI_OWNER_PASSWORD:?Set migration role password}
    volumes:
      - type: bind
        source: /srv/acti/postgresql/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-init.sql
        target: /docker-entrypoint-initdb.d/001-roles.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acti"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    networks: [internal]
  redis:
    image: ${REDIS_IMAGE:?Set a pinned Redis image}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
    networks: [internal]
    read_only: true
    tmpfs: [/data]
  migrate:
    <<: *app
    command: ["python", "-m", "app.db.migrate"]
    environment:
      <<: *app-env
      ACTI_DATABASE_URL: ${ACTI_MIGRATION_DATABASE_URL:?Set migration database URL}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    environment:
      <<: *app-env
      ACTI_OIDC_ENABLED: ${ACTI_OIDC_ENABLED:-false}
      ACTI_OIDC_ISSUER: ${ACTI_OIDC_ISSUER:-}
      ACTI_OIDC_CLIENT_ID: ${ACTI_OIDC_CLIENT_ID:-}
      ACTI_OIDC_CLIENT_SECRET: ${ACTI_OIDC_CLIENT_SECRET:-}
      ACTI_OIDC_CA_FILE: /etc/acti-ca/ca.crt
      ACTI_OIDC_LABEL: ${ACTI_OIDC_LABEL:-Корпоративная учётная запись}
    volumes:
      - type: bind
        source: /srv/acti/documents/objects
        target: /documents
        bind:
          create_host_path: false
      - type: bind
        source: ${ACTI_HTTPS_CA_FILE:-/etc/acti-v3/tls/ca.crt}
        target: /etc/acti-ca/ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks: [internal, identity]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - type: bind
        source: /srv/acti/documents/objects
        target: /documents
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,time; r=redis.Redis(host='redis'); assert time.time()-float(r.get('worker:heartbeat') or 0)<30"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    image: acti-frontend:${ACTI_SOURCE_SHA}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set pinned Node image}
        NGINX_IMAGE: ${NGINX_IMAGE:?Set pinned Nginx image}
        SOURCE_SHA: ${ACTI_SOURCE_SHA}
    ports: ["443:443", "80:80"]
    volumes:
      - type: bind
        source: /etc/acti-v3/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/etc/nginx/tls/ca.crt", "https://localhost/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks:
      internal:
        aliases: ["${ACTI_PUBLIC_HOST:-acti-frontend}"]
      edge: {}
  keycloak:
    # Keycloak 26.8.1, linux/amd64. Optional, enabled only after provisioning.
    image: acti-keycloak:26.8.1
    build:
      context: .
      dockerfile: keycloak.Dockerfile
    profiles: [idp]
    command: [start, --optimized, --http-enabled=true, --http-relative-path=/idp, --http-management-relative-path=/, --proxy-headers=xforwarded, --cache=local]
    environment:
      KC_HOSTNAME: ${ACTI_ORIGIN}/idp
      KC_HOSTNAME_STRICT: "true"
      KC_DB_URL: jdbc:postgresql://postgres:5432/acti
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: acti_keycloak
      KC_DB_PASSWORD: ${ACTI_IDP_DB_PASSWORD:-}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "8"
      KC_TRUSTSTORE_PATHS: /etc/acti-idp-trust
      # Unresolved null entries are omitted, rather than passed as empty strings.
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /opt/keycloak/data]
    volumes:
      - type: bind
        source: /etc/acti-v3/idp/trust
        target: /etc/acti-idp-trust
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 24
    restart: "no"
    networks: [internal, identity]
networks:
  internal:
    internal: true
  edge: {}
  identity: {}
