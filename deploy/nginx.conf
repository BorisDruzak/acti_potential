resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream acti_api {
    zone acti_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 35m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:43127 http://127.0.0.1:43128 http://127.0.0.1:43129 http://127.0.0.1:43130 http://127.0.0.1:43131 http://127.0.0.1:43132 http://127.0.0.1:43133 http://127.0.0.1:43134 http://127.0.0.1:43135 http://127.0.0.1:43136 http://127.0.0.1:43137 http://127.0.0.1:43138 http://127.0.0.1:43139 http://127.0.0.1:43140 http://127.0.0.1:43141 http://127.0.0.1:43142; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://acti_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
    }
    # Resolve at request time so disabled/unavailable IdP never prevents local login.
    location /idp/ {
        set $identity_upstream keycloak:8080;
        proxy_pass http://$identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        # Keycloak supplies its own per-response CSP, including script nonces.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }
    location / {
        # Optional canonical-domain redirect; health/API routes stay available.
        include /etc/nginx/tls/legacy-ui-*.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# Root-owned domain virtual hosts share the existing read-only TLS mount.
include /etc/nginx/tls/domain-*.conf;
